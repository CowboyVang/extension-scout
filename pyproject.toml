[project]
name = "extension-scout"
version = "1.0.0"
description = "Browser extension metadata scraper for Chrome, Edge, and Firefox stores"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Sebastian" },
]

dependencies = [
    "playwright>=1.40.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
]

[project.scripts]
extension-scout = "extension_scout:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
